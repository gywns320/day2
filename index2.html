<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카운터</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; font-family: "Segoe UI", "Malgun Gothic", sans-serif; background: #f0f2f5; }
  #count { font-size: 80px; font-weight: bold; color: #333; }
  button { padding: 14px 36px; border: 0; border-radius: 28px; background: #4f46e5; color: #fff; font-size: 18px; cursor: pointer; }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
  <div id="count">0</div>
  <button id="btn">클릭 +1</button>
<script>
  let n = 0;
  const count = document.getElementById('count');
  document.getElementById('btn').addEventListener('click', () => {
    count.textContent = ++n;
  });
</script>
</body>
</html>
