<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응형 메뉴</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Malgun Gothic", sans-serif; background: #f0f2f5; color: #222; line-height: 1.6; }

  .topbar { position: sticky; top: 0; z-index: 10; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .bar-inner { max-width: 1100px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 20px; font-weight: bold; color: #4f46e5; text-decoration: none; }

  .menu { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
  .menu a { display: block; padding: 8px 16px; border-radius: 20px; color: #333; text-decoration: none; font-size: 15px; }
  .menu a:hover, .menu a.active { background: #4f46e5; color: #fff; }

  /* 햄버거 아이콘 (모바일에서만 표시) */
  .hamburger { display: none; width: 44px; height: 44px; border: 0; background: none; cursor: pointer; padding: 10px; }
  .hamburger span { display: block; height: 3px; margin: 5px 0; background: #333; border-radius: 2px; transition: transform .25s, opacity .25s; }
  .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  .panel { display: none; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .panel.show { display: block; }
  .panel h2 { margin: 0 0 10px; color: #4f46e5; }
  .panel p { margin: 0; }

  @media (max-width: 700px) {
    .hamburger { display: block; }
    .menu { position: absolute; top: 56px; left: 0; right: 0; flex-direction: column; gap: 0; background: #fff; box-shadow: 0 6px 10px rgba(0,0,0,.1); max-height: 0; overflow: hidden; transition: max-height .3s; }
    .menu.open { max-height: 320px; }
    .menu a { border-radius: 0; padding: 14px 20px; border-top: 1px solid #eee; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="bar-inner">
      <a class="logo" href="#">📋 카테고리</a>
      <button class="hamburger" id="hamburger" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="menu" id="menu">
        <li><a href="#food" data-tab="food" class="active">🍜 음식</a></li>
        <li><a href="#furniture" data-tab="furniture">🛋️ 가구</a></li>
        <li><a href="#realestate" data-tab="realestate">🏠 부동산</a></li>
        <li><a href="#stock" data-tab="stock">📈 주식</a></li>
        <li><a href="#map" data-tab="map">🗺️ 지도</a></li>
      </ul>
    </div>
  </div>

  <main>
    <section class="panel show" id="food"><h2>🍜 음식</h2><p>음식 카테고리 화면입니다.</p></section>
    <section class="panel" id="furniture"><h2>🛋️ 가구</h2><p>가구 카테고리 화면입니다.</p></section>
    <section class="panel" id="realestate"><h2>🏠 부동산</h2><p>부동산 카테고리 화면입니다.</p></section>
    <section class="panel" id="stock"><h2>📈 주식</h2><p>주식 카테고리 화면입니다.</p></section>
    <section class="panel" id="map"><h2>🗺️ 지도</h2><p>지도 카테고리 화면입니다.</p></section>
  </main>

<script>
  const hamburger = document.getElementById('hamburger');
  const menu = document.getElementById('menu');
  const links = menu.querySelectorAll('a');

  function setMenu(open) {
    menu.classList.toggle('open', open);
    hamburger.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', open);
    hamburger.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
  }
  hamburger.addEventListener('click', () => setMenu(!menu.classList.contains('open')));

  links.forEach(a => a.addEventListener('click', (e) => {
    e.preventDefault();
    links.forEach(l => l.classList.toggle('active', l === a));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('show', p.id === a.dataset.tab));
    setMenu(false);
  }));
</script>
</body>
</html>
