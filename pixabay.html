<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixabay 이미지 슬라이드</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Malgun Gothic", sans-serif; background: #f0f2f5; color: #222; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
  h1 { color: #ea580c; font-size: clamp(20px, 5vw, 28px); margin: 0 0 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input { flex: 1; min-width: 160px; padding: 11px 14px; border: 1px solid #ccd; border-radius: 22px; font-size: 14px; }
  button { padding: 11px 22px; border: 0; border-radius: 22px; background: #f97316; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #ea580c; }
  #msg { min-height: 22px; font-size: 14px; color: #c2410c; margin-bottom: 8px; }

  .slider { position: relative; background: #111; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; display: none; }
  .slider.show { display: block; }
  .track { display: flex; height: 100%; transition: transform .4s ease; }
  .slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; padding: 0; border-radius: 50%; background: rgba(0,0,0,.5); font-size: 20px; }
  .nav:hover { background: rgba(234,88,12,.9); }
  #prev { left: 10px; } #next { right: 10px; }
  .counter { position: absolute; bottom: 10px; right: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; padding: 3px 10px; border-radius: 12px; }

  .thumbs { display: none; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
  .thumbs.show { display: flex; }
  .thumbs img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; cursor: pointer; opacity: .55; border: 2px solid transparent; flex: none; }
  .thumbs img.on { opacity: 1; border-color: #ea580c; }
  .credit { font-size: 12px; color: #666; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼️ Pixabay 이미지 슬라이드</h1>

  <div class="row">
    <input id="key" type="password" placeholder="Pixabay API 키 입력" autocomplete="off">
  </div>
  <form class="row" id="form">
    <input id="q" type="text" placeholder="검색어 입력 (예: 제주도, 바다, flower)" autocomplete="off">
    <button type="submit">검색</button>
  </form>
  <div id="msg"></div>

  <div class="slider" id="slider">
    <div class="track" id="track"></div>
    <button class="nav" id="prev" aria-label="이전">◀</button>
    <button class="nav" id="next" aria-label="다음">▶</button>
    <div class="counter" id="counter"></div>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="credit" id="credit"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let images = [], idx = 0, timer = null;

  // 키는 이 브라우저에만 저장 (코드에 직접 적지 않기)
  try { $('key').value = localStorage.getItem('pixabay_key') || ''; } catch (e) {}

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const key = $('key').value.trim();
    const q = $('q').value.trim();
    if (!key) return ($('msg').textContent = 'API 키를 입력하세요.');
    if (!q) return ($('msg').textContent = '검색어를 입력하세요.');
    try { localStorage.setItem('pixabay_key', key); } catch (e) {}

    $('msg').textContent = '불러오는 중...';
    const url = 'https://pixabay.com/api/?key=' + encodeURIComponent(key)
      + '&q=' + encodeURIComponent(q)
      + '&image_type=photo&per_page=10&safesearch=true&lang=ko';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status === 400 ? 'API 키가 올바르지 않습니다.' : '오류 ' + res.status);
      const data = await res.json();
      images = data.hits;
      if (!images.length) { $('msg').textContent = '검색 결과가 없습니다.'; hide(); return; }
      $('msg').textContent = '"' + q + '" 검색 결과 ' + images.length + '장';
      build();
    } catch (err) {
      $('msg').textContent = '실패: ' + err.message;
    }
  });

  function hide() { $('slider').classList.remove('show'); $('thumbs').classList.remove('show'); $('credit').textContent = ''; clearInterval(timer); }

  function build() {
    $('track').innerHTML = images.map(h => `<div class="slide"><img src="${h.webformatURL}" alt="${h.tags}"></div>`).join('');
    $('thumbs').innerHTML = images.map((h, i) => `<img src="${h.previewURL}" data-i="${i}" alt="">`).join('');
    $('slider').classList.add('show');
    $('thumbs').classList.add('show');
    go(0);
    restart();
  }

  function go(i) {
    idx = (i + images.length) % images.length;
    $('track').style.transform = `translateX(-${idx * 100}%)`;
    $('counter').textContent = (idx + 1) + ' / ' + images.length;
    document.querySelectorAll('#thumbs img').forEach((t, n) => t.classList.toggle('on', n === idx));
    $('credit').textContent = '📷 ' + images[idx].user + ' · Pixabay';
  }

  function restart() { clearInterval(timer); timer = setInterval(() => go(idx + 1), 4000); }

  $('prev').onclick = () => { go(idx - 1); restart(); };
  $('next').onclick = () => { go(idx + 1); restart(); };
  $('thumbs').addEventListener('click', e => { if (e.target.dataset.i) { go(+e.target.dataset.i); restart(); } });
  document.addEventListener('keydown', e => {
    if (!images.length || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === 'ArrowRight') $('next').click();
  });
</script>
</body>
</html>
